name: Vendor Opportunity Alerts Daily Monitor

# Started at 5:00 AM CT Mon-Fri by cron-job.org (via the GitHub API).
# Can also be started by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Never let two runs overlap (they would race on the saved "seen" list).
concurrency:
  group: vendor-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install playwright

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # Restores the most recent saved "seen" list (each run saves a new copy)
      - name: Restore seen opportunities cache
        uses: actions/cache/restore@v4
        with:
          path: seen_opportunities.json
          key: vendor-seen-opps-${{ github.run_id }}
          restore-keys: vendor-seen-opps-

      - name: Run vendor matching monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          VENDOR_SHEET_CSV_URL: ${{ secrets.VENDOR_SHEET_CSV_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: alerts@txsmartalerts.com
          REPLY_TO: txsmartbuyalerts@gmail.com
        run: python scraper.py

      # Saves the updated "seen" list (and any undelivered bids) under a new
      # name every run, even when the run fails, so retries pick them up.
      - name: Save seen opportunities cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_opportunities.json
          key: vendor-seen-opps-${{ github.run_id }}
